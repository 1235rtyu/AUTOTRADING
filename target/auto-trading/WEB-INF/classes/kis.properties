# Korea Investment & Securities Open API settings
# demo | real
kis.env=real

# Default buy amount per order (KRW for KRX, USD for US). 0 = disabled.
# Restored automatically on server restart so running symbols don't need manual re-entry.
kis.defaultBuyAmount=0

# KIS app key/secret (required for real requests)
kis.appKey=PSEeh3ru8Fua4q7U707w8LDqwIlKDgcAqfCA
