# Optional override for base URL (leave blank to use env defaults)
kis.baseUrl=

# Default account number/product code (optional if you login from UI)
# Example accountNo: 12345678-01
kis.accountNo=
kis.accountProductCode=

# Customer type (P: 개인, B: 법인)
kis.customerType=P

# Use hashkey header for POST order requests
kis.requireHashKey=true

# Force live endpoint/TR-ID usage even if env is changed accidentally.
kis.forceReal=true

# Overseas stock order TR IDs (override if your account/env requires different values)
kis.overseas.trIdBuy=TTTT1002U
kis.overseas.trIdSell=TTTT1006U
kis.overseas.demoTrIdBuy=VTTT1002U
kis.overseas.demoTrIdSell=VTTT1001U

# Order type codes (ORD_DVSN) - verify with KIS API guide
kis.domestic.ordDvsnLimit=00
kis.domestic.ordDvsnMarket=01
kis.overseas.ordDvsnLimit=00
# US sell market (MOO=31, MOC=33). Default to MOO; override if needed.
kis.overseas.ordDvsnMarket=31
kis.overseas.usSellFallbackDiscount=0.002
kis.overseas.ordDvsnUsLimit=00
kis.overseas.ordDvsnUsSellMoo=31
kis.overseas.ordDvsnUsSellMoc=33
# 정규장 중 시장가 불가 시 최유리지정가 (ORD_DVSN=32, OVRS_ORD_UNPR=0)
kis.overseas.ordDvsnUsSellBestLimit=32
